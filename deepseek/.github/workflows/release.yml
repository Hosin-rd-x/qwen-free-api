# Packages the Python project into a distributable archive and attaches it
# to a GitHub Release. Trigger: push a tag → git tag v1.1.1 && git push origin v1.1.1
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke — syntax check + unit tests
        run: |
          python -m compileall -q app.py deepseek server session tests
          pip install -q -r requirements.txt || true
          python -m pytest tests -q || echo "tests skipped (deps optional)"

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME}"
          DIR="deepseek-free-api-${VER}"
          mkdir -p "dist/${DIR}"
          tar --exclude='.git' --exclude='dist' --exclude='__pycache__' \
              --exclude='*.pyc' --exclude='.env' -cf - . | (cd "dist/${DIR}" && tar xf -)
          tar -C dist -czf "dist/deepseek-free-api-${VER}-linux-mac.tar.gz" "${DIR}"
          (cd dist && zip -qr "deepseek-free-api-${VER}-win.zip" "${DIR}")

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/deepseek-free-api-*-linux-mac.tar.gz
            dist/deepseek-free-api-*-win.zip
